name: CI

# Required to pass before merging to main (branch protection). Keep job names
# stable: branch protection refers to them as required status checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build & test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt on the files above."; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  postgres:
    name: Go test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unison
          POSTGRES_PASSWORD: unison
          POSTGRES_DB: unison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unison"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UNISON_TEST_POSTGRES: postgres://unison:unison@localhost:5432/unison?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm test
        working-directory: npm
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # what release.yml runs
      - run: npm test
        working-directory: npm

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The built UI is committed (internal/webui/dist) and embedded in the
      # binary, so a web change without `make web` would ship stale UI.
      - name: Committed web build is up to date
        run: |
          git add -A internal/webui/dist
          git diff --cached --stat --exit-code -- internal/webui/dist || {
            echo "internal/webui/dist is out of date: run 'make web' and commit the result."
            exit 1
          }

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unison:ci .
